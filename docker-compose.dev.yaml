services:
  spoofing_detection_api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code/src:/code/spoofing_detection_api
    volumes:
      - ./spoofing_detection_api/:/code/spoofing_detection_api
      - ./src:/code/src
      - ./.env:/code/.env
    command:
      [
        "python3",
        "-m",
        "robyn",
        "spoofing_detection_api/app/main.py",
        "--dev"
      ]
